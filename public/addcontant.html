<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommTrace — Add Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --neon:#00f5ff; --neon2:#ff00ff; --neon3:#00ff88; --bg:#020b18; --panel:rgba(5,18,38,0.85); --border:rgba(0,245,255,0.15); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Exo 2',sans-serif; background:var(--bg); color:#c8eeff; min-height:100vh; }
  #stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .star { position:absolute; border-radius:50%; background:#fff; animation:twinkle var(--d) infinite alternate; }
  @keyframes twinkle { from{opacity:0.05} to{opacity:0.7} }
  .grid-bg { position:fixed; inset:0; z-index:0; pointer-events:none; background-image:linear-gradient(rgba(0,245,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.025) 1px,transparent 1px); background-size:50px 50px; }
  .orb { position:fixed; border-radius:50%; filter:blur(100px); z-index:0; pointer-events:none; }
  .orb1 { width:500px;height:500px; background:rgba(0,245,255,0.05); top:-100px; right:-100px; }
  .orb2 { width:350px;height:350px; background:rgba(255,0,255,0.04); bottom:-80px; left:-60px; }
  .scan-line { position:fixed; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--neon),transparent); opacity:0.2; z-index:20; pointer-events:none; animation:scan 6s linear infinite; }
  @keyframes scan { from{top:-1px} to{top:100vh} }

  nav { position:sticky; top:0; z-index:100; background:rgba(2,11,24,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 32px; display:flex; align-items:center; justify-content:space-between; height:64px; box-shadow:0 2px 30px rgba(0,245,255,0.05); }
  .nav-brand { font-family:'Orbitron',monospace; font-weight:900; font-size:1.3rem; letter-spacing:3px; background:linear-gradient(135deg,var(--neon),var(--neon2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .nav-links { display:flex; gap:4px; }
  .nav-links a { padding:8px 14px; border-radius:8px; text-decoration:none; font-family:'Orbitron',monospace; font-size:0.68rem; letter-spacing:1px; color:rgba(255,255,255,0.45); transition:all 0.2s; }
  .nav-links a:hover { color:var(--neon); background:rgba(0,245,255,0.08); }
  .nav-links a.active { color:var(--neon); background:rgba(0,245,255,0.1); border:1px solid rgba(0,245,255,0.2); }
  .avatar { width:38px;height:38px; border-radius:50%; background:linear-gradient(135deg,var(--neon),var(--neon2)); display:flex; align-items:center; justify-content:center; font-family:'Orbitron',monospace; font-weight:700; color:#000; font-size:0.9rem; animation:avatarPulse 3s ease-in-out infinite alternate; }
  @keyframes avatarPulse { from{box-shadow:0 0 10px rgba(0,245,255,0.3)} to{box-shadow:0 0 25px rgba(255,0,255,0.5)} }

  .main { position:relative; z-index:10; padding:40px 32px; max-width:700px; margin:0 auto; }
  .page-title { font-family:'Orbitron',monospace; font-size:2rem; font-weight:900; background:linear-gradient(135deg,#fff,var(--neon)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:6px; }
  .page-sub { color:rgba(255,255,255,0.35); font-size:0.8rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:32px; }

  .form-card {
    background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:36px;
    backdrop-filter:blur(20px); position:relative; overflow:hidden;
    animation:cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    box-shadow:0 0 60px rgba(0,245,255,0.06);
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(30px) scale(0.96)} to{opacity:1;transform:translateY(0) scale(1)} }
  .form-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--neon),var(--neon2),var(--neon3)); }
  .form-card::after { content:''; position:absolute; top:16px; right:16px; width:30px; height:30px; border-right:2px solid var(--neon); border-top:2px solid var(--neon); border-radius:0 6px 0 0; animation:cornerPulse 2s infinite alternate; }
  @keyframes cornerPulse { from{opacity:0.3} to{opacity:1;filter:drop-shadow(0 0 6px var(--neon))} }

  .section-label { font-family:'Orbitron',monospace; font-size:0.72rem; letter-spacing:3px; text-transform:uppercase; color:var(--neon); margin-bottom:20px; display:flex; align-items:center; gap:8px; }
  .section-label::before { content:''; width:6px;height:6px; border-radius:50%; background:var(--neon); box-shadow:0 0 8px var(--neon); }
  .section-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(0,245,255,0.3),transparent); }

  .field-group { margin-bottom:22px; position:relative; }
  .field-group label { display:block; font-size:0.68rem; letter-spacing:2px; text-transform:uppercase; color:rgba(0,245,255,0.7); margin-bottom:8px; font-family:'Orbitron',monospace; }
  .field-group input, .field-group textarea {
    width:100%; padding:14px 18px; background:rgba(0,245,255,0.04); border:1px solid rgba(0,245,255,0.12);
    border-radius:10px; color:#e0f8ff; font-family:'Exo 2',sans-serif; font-size:0.95rem;
    outline:none; transition:all 0.3s ease; resize:none;
  }
  .field-group textarea { min-height:100px; }
  .field-group input::placeholder, .field-group textarea::placeholder { color:rgba(255,255,255,0.2); }
  .field-group input:focus, .field-group textarea:focus {
    border-color:var(--neon); background:rgba(0,245,255,0.08); box-shadow:0 0 25px rgba(0,245,255,0.18),inset 0 0 15px rgba(0,245,255,0.04);
  }
  .field-group::after { content:''; position:absolute; left:1px; bottom:1px; height:2px; width:0; background:linear-gradient(90deg,var(--neon),var(--neon2)); border-radius:2px; transition:width 0.4s ease; }
  .field-group:focus-within::after { width:calc(100% - 2px); }

  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  .btn-save {
    width:100%; padding:17px; background:linear-gradient(135deg,rgba(0,245,255,0.1),rgba(255,0,255,0.1));
    border:1px solid var(--neon); border-radius:12px; color:var(--neon);
    font-family:'Orbitron',monospace; font-size:0.88rem; font-weight:700; letter-spacing:3px;
    cursor:pointer; position:relative; overflow:hidden; transition:all 0.3s ease; margin-top:8px;
  }
  .btn-save::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--neon),var(--neon2)); opacity:0; transition:opacity 0.3s; }
  .btn-save:hover { color:#000; box-shadow:0 0 50px rgba(0,245,255,0.4),0 0 20px rgba(255,0,255,0.2); transform:translateY(-2px); }
  .btn-save:hover::before { opacity:1; }
  .btn-save span { position:relative; z-index:1; }
  .ripple { position:absolute; border-radius:50%; background:rgba(0,245,255,0.4); transform:scale(0); animation:rippleAnim 0.6s linear; pointer-events:none; }
  @keyframes rippleAnim { to{transform:scale(4);opacity:0} }

  /* Success toast */
  .toast { position:fixed; top:80px; right:24px; background:rgba(0,255,136,0.1); border:1px solid var(--neon3); border-radius:12px; padding:16px 24px; color:var(--neon3); font-family:'Orbitron',monospace; font-size:0.75rem; letter-spacing:1px; transform:translateX(120%); transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index:200; backdrop-filter:blur(16px); }
  .toast.show { transform:translateX(0); }

  /* Floating particles */
  .particle { position:fixed; border-radius:50%; pointer-events:none; z-index:0; animation:particleFloat linear infinite; }
  @keyframes particleFloat { 0%{transform:translateY(100vh) rotate(0deg);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-100px) rotate(360deg);opacity:0} }
</style>
</head>
<body>
<div id="stars"></div>
<div class="grid-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="scan-line"></div>
<div class="toast" id="toast">✓ Contact Saved Successfully</div>

<nav>
  <div class="nav-brand">CommTrace</div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="addcontant.html" class="active">Add Contact</a>
    <a href="context.html">Contacts</a>
    <a href="profile.html">Profile</a>
    <a href="about.html">About</a>
    <a href="index.html">Logout</a>
  </div>
  <div class="avatar">V</div>
</nav>

<div class="main">
  <div class="page-title">Add New Contact</div>
  <div class="page-sub">⬡ Create and manage your contacts securely</div>

  <div class="form-card">
    <div class="section-label">Contact Details</div>

    <div class="field-row">
      <div class="field-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter full name" id="name">
      </div>
      <div class="field-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="+91 XXXXX XXXXX" id="phone">
      </div>
    </div>

    <div class="field-group">
      <label>Email Address</label>
      <input type="email" placeholder="contact@example.com" id="email">
    </div>

    <div class="field-group">
      <label>Description / Notes</label>
      <textarea placeholder="Add notes about this contact..." id="desc"></textarea>
    </div>

    <button class="btn-save" onclick="saveContact(event)"><span>◈ SAVE CONTACT</span></button>
  </div>
</div>

<script>
const starsEl=document.getElementById('stars');
for(let i=0;i<120;i++){
  const s=document.createElement('div'); s.className='star';
  const size=Math.random()*2+0.5;
  s.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${Math.random()*4+2}s;animation-delay:${Math.random()*5}s`;
  starsEl.appendChild(s);
}

// Particles
for(let i=0;i<8;i++){
  const p=document.createElement('div'); p.className='particle';
  const size=Math.random()*4+2;
  const colors=['rgba(0,245,255,0.3)','rgba(255,0,255,0.3)','rgba(0,255,136,0.3)'];
  p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*10}s`;
  document.body.appendChild(p);
}

function addRipple(btn, e){
  const r=document.createElement('span'); r.className='ripple';
  const rect=btn.getBoundingClientRect();
  const size=Math.max(btn.offsetWidth,btn.offsetHeight);
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  btn.appendChild(r); setTimeout(()=>r.remove(),600);
}

function saveContact(e){
  addRipple(e.currentTarget, e);
  const name=document.getElementById('name').value;
  const phone=document.getElementById('phone').value;
  const email=document.getElementById('email').value;
  const desc=document.getElementById('desc').value;
  if(!name.trim()){ alert('Please enter a name'); return; }
  // Save to localStorage
  const contacts=JSON.parse(localStorage.getItem('ct_contacts')||'[]');
  contacts.push({id:Date.now(),name,phone,email,desc,date:new Date().toISOString()});
  localStorage.setItem('ct_contacts',JSON.stringify(contacts));
  // Show toast
  const toast=document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3000);
  // Clear form
  ['name','phone','email','desc'].forEach(id=>document.getElementById(id).value='');
}
</script>
</body>
</html>
