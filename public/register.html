<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommTrace — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #00f5ff;
    --neon2: #ff00ff;
    --neon3: #00ff88;
    --bg: #020b18;
    --card: rgba(5,20,40,0.85);
    --glow: 0 0 30px rgba(0,245,255,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Exo 2', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  /* Animated starfield */
  #stars { position:fixed; inset:0; z-index:0; }
  .star {
    position:absolute;
    border-radius:50%;
    background:#fff;
    animation: twinkle var(--d) infinite alternate ease-in-out;
  }
  @keyframes twinkle { from{opacity:0.1;transform:scale(1)} to{opacity:1;transform:scale(1.5)} }
  /* Grid lines */
  .grid-bg {
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove { from{transform:translateY(0)} to{transform:translateY(60px)} }
  /* Orbs */
  .orb {
    position:fixed; border-radius:50%; filter:blur(80px); z-index:0; pointer-events:none;
    animation: orbFloat 8s ease-in-out infinite alternate;
  }
  .orb1 { width:400px;height:400px; background:rgba(0,245,255,0.08); top:-100px; left:-100px; }
  .orb2 { width:350px;height:350px; background:rgba(255,0,255,0.06); bottom:-80px; right:-80px; animation-delay:-4s; }
  .orb3 { width:250px;height:250px; background:rgba(0,255,136,0.05); top:50%; left:60%; animation-delay:-2s; }
  @keyframes orbFloat { from{transform:translate(0,0) scale(1)} to{transform:translate(30px,30px) scale(1.1)} }

  .scene { perspective:1200px; z-index:10; position:relative; }
  .card {
    background: var(--card);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 24px;
    padding: 48px 40px;
    width: 400px;
    backdrop-filter: blur(24px);
    box-shadow: 0 0 60px rgba(0,245,255,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
    animation: cardIn 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
    transform-style: preserve-3d;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    box-shadow: 0 0 100px rgba(0,245,255,0.2), 0 0 40px rgba(255,0,255,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  @keyframes cardIn {
    from { opacity:0; transform: rotateX(20deg) translateY(40px) scale(0.9); }
    to   { opacity:1; transform: rotateX(0) translateY(0) scale(1); }
  }
  /* Corner accents */
  .card::before, .card::after {
    content:''; position:absolute; width:30px; height:30px;
    border-color: var(--neon); border-style:solid;
    animation: cornerPulse 2s ease-in-out infinite alternate;
  }
  .card::before { top:12px; left:12px; border-width:2px 0 0 2px; border-radius:4px 0 0 0; }
  .card::after  { bottom:12px; right:12px; border-width:0 2px 2px 0; border-radius:0 0 4px 0; }
  @keyframes cornerPulse { from{opacity:0.4} to{opacity:1;filter:drop-shadow(0 0 6px var(--neon))} }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 2.4rem;
    font-weight: 900;
    text-align: center;
    background: linear-gradient(135deg, var(--neon), var(--neon2), var(--neon3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
    text-shadow: none;
    animation: logoGlow 3s ease-in-out infinite alternate;
    margin-bottom: 4px;
  }
  @keyframes logoGlow {
    from { filter: drop-shadow(0 0 10px rgba(0,245,255,0.6)); }
    to   { filter: drop-shadow(0 0 25px rgba(255,0,255,0.8)); }
  }
  .subtitle { text-align:center; color:rgba(255,255,255,0.45); font-size:0.78rem; letter-spacing:3px; text-transform:uppercase; margin-bottom:6px; }
  .tagline { text-align:center; color:rgba(0,245,255,0.6); font-size:0.72rem; letter-spacing:1px; margin-bottom:32px; }

  .field-group { margin-bottom:20px; position:relative; }
  .field-group label { display:block; font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; color:var(--neon); margin-bottom:8px; font-family:'Orbitron',monospace; }
  .field-group input {
    width:100%; padding:14px 18px;
    background: rgba(0,245,255,0.04);
    border: 1px solid rgba(0,245,255,0.15);
    border-radius: 10px;
    color: #e0f8ff;
    font-family: 'Exo 2', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s ease;
    position:relative; z-index:1;
  }
  .field-group input::placeholder { color: rgba(255,255,255,0.25); }
  .field-group input:focus {
    border-color: var(--neon);
    background: rgba(0,245,255,0.08);
    box-shadow: 0 0 20px rgba(0,245,255,0.2), inset 0 0 15px rgba(0,245,255,0.05);
  }
  /* Scanning line on focus */
  .field-group::after {
    content:''; position:absolute; left:0; bottom:0; height:2px; width:0;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    border-radius:2px; transition: width 0.4s ease; z-index:2; bottom:1px; left:1px;
  }
  .field-group:focus-within::after { width: calc(100% - 2px); }

  .btn-primary {
    width:100%; padding:16px;
    background: linear-gradient(135deg, rgba(0,245,255,0.15), rgba(255,0,255,0.15));
    border: 1px solid var(--neon);
    border-radius: 12px;
    color: var(--neon);
    font-family: 'Orbitron', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    position: relative; overflow:hidden;
    transition: all 0.3s ease;
    margin-top: 8px;
  }
  .btn-primary::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    opacity:0; transition: opacity 0.3s ease;
  }
  .btn-primary:hover { color:#000; box-shadow: var(--glow), 0 0 40px rgba(255,0,255,0.3); transform:translateY(-2px); }
  .btn-primary:hover::before { opacity:1; }
  .btn-primary span { position:relative; z-index:1; }
  .btn-primary:active { transform: scale(0.98); }

  /* Ripple */
  .ripple { position:absolute; border-radius:50%; background:rgba(0,245,255,0.4); transform:scale(0); animation:rippleAnim 0.6s linear; pointer-events:none; }
  @keyframes rippleAnim { to{transform:scale(4);opacity:0} }

  .login-link { text-align:center; margin-top:24px; color:rgba(255,255,255,0.4); font-size:0.85rem; }
  .login-link a { color:var(--neon); text-decoration:none; font-weight:600; transition:all 0.2s; }
  .login-link a:hover { color:var(--neon2); text-shadow: 0 0 10px var(--neon2); }

  /* Scanning beam */
  .scan-line {
    position:fixed; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    opacity:0.3; z-index:5; pointer-events:none;
    animation: scan 4s linear infinite;
  }
  @keyframes scan { from{top:-2px} to{top:100vh} }

  .data-bits {
    position:fixed; font-family:'Orbitron',monospace; font-size:10px;
    color:rgba(0,245,255,0.15); z-index:0; pointer-events:none;
    animation: dataDrift linear infinite;
  }
  @keyframes dataDrift { from{transform:translateY(-100px)} to{transform:translateY(110vh)} }
</style>
</head>
<body>
<div id="stars"></div>
<div class="grid-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="scan-line"></div>

<div class="scene">
  <div class="card" id="card">
    <div class="logo">CommTrace</div>
    <div class="subtitle">Communication Analytics Platform</div>
    <div class="tagline">⬡ Create Your Account ⬡</div>

    <div class="field-group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name">
    </div>
    <div class="field-group">
      <label>Email Address</label>
      <input type="email" placeholder="Enter your email">
    </div>
    <div class="field-group">
      <label>Password</label>
      <input type="password" placeholder="Create a strong password">
    </div>

    <button class="btn-primary" onclick="addRipple(event)"><span>◈ CREATE ACCOUNT</span></button>
    <div class="login-link">Already have an account? <a href="index.html">Login</a></div>
  </div>
</div>

<script>
// Stars
const starsEl = document.getElementById('stars');
for(let i=0;i<180;i++){
  const s=document.createElement('div');
  s.className='star';
  const size=Math.random()*2.5+0.5;
  s.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${Math.random()*4+2}s;animation-delay:${Math.random()*4}s`;
  starsEl.appendChild(s);
}
// Data bits
const bits=['01','10','11','00','101','110','001'];
for(let i=0;i<15;i++){
  const d=document.createElement('div');
  d.className='data-bits';
  d.textContent=bits[Math.floor(Math.random()*bits.length)];
  d.style.cssText=`left:${Math.random()*100}%;animation-duration:${Math.random()*8+6}s;animation-delay:${Math.random()*6}s`;
  document.body.appendChild(d);
}
// 3D tilt
const card=document.getElementById('card');
document.addEventListener('mousemove',e=>{
  const {innerWidth:W,innerHeight:H}=window;
  const rx=((e.clientY/H)-0.5)*12;
  const ry=((e.clientX/W)-0.5)*-12;
  card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
});
document.addEventListener('mouseleave',()=>{ card.style.transform='rotateX(0) rotateY(0)'; });

// Ripple
function addRipple(e){
  const btn=e.currentTarget;
  const r=document.createElement('span');
  r.className='ripple';
  const size=Math.max(btn.offsetWidth,btn.offsetHeight);
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.offsetX-size/2}px;top:${e.offsetY-size/2}px`;
  btn.appendChild(r);
  setTimeout(()=>r.remove(),600);
}
</script>
</body>
</html>
