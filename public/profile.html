<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommTrace — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --neon:#00f5ff; --neon2:#ff00ff; --neon3:#00ff88; --bg:#020b18; --panel:rgba(5,18,38,0.85); --border:rgba(0,245,255,0.15); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Exo 2',sans-serif; background:var(--bg); color:#c8eeff; min-height:100vh; }
  #stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .star { position:absolute; border-radius:50%; background:#fff; animation:twinkle var(--d) infinite alternate; }
  @keyframes twinkle { from{opacity:0.05} to{opacity:0.7} }
  .grid-bg { position:fixed; inset:0; z-index:0; pointer-events:none; background-image:linear-gradient(rgba(0,245,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.025) 1px,transparent 1px); background-size:50px 50px; }
  .orb { position:fixed; border-radius:50%; filter:blur(100px); z-index:0; pointer-events:none; }
  .orb1 { width:500px;height:500px; background:rgba(0,245,255,0.06); top:-100px; right:-100px; }
  .orb2 { width:400px;height:400px; background:rgba(255,0,255,0.05); bottom:-80px; left:-60px; }
  .scan-line { position:fixed; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--neon),transparent); opacity:0.2; z-index:20; pointer-events:none; animation:scan 6s linear infinite; }
  @keyframes scan { from{top:-1px} to{top:100vh} }

  nav { position:sticky; top:0; z-index:100; background:rgba(2,11,24,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 32px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .nav-brand { font-family:'Orbitron',monospace; font-weight:900; font-size:1.3rem; letter-spacing:3px; background:linear-gradient(135deg,var(--neon),var(--neon2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .nav-links { display:flex; gap:4px; }
  .nav-links a { padding:8px 14px; border-radius:8px; text-decoration:none; font-family:'Orbitron',monospace; font-size:0.68rem; letter-spacing:1px; color:rgba(255,255,255,0.45); transition:all 0.2s; }
  .nav-links a:hover { color:var(--neon); background:rgba(0,245,255,0.08); }
  .nav-links a.active { color:var(--neon); background:rgba(0,245,255,0.1); border:1px solid rgba(0,245,255,0.2); }
  .avatar-nav { width:38px;height:38px; border-radius:50%; background:linear-gradient(135deg,var(--neon),var(--neon2)); display:flex; align-items:center; justify-content:center; font-family:'Orbitron',monospace; font-weight:700; color:#000; animation:avatarPulse 3s infinite alternate; }
  @keyframes avatarPulse { from{box-shadow:0 0 10px rgba(0,245,255,0.3)} to{box-shadow:0 0 25px rgba(255,0,255,0.5)} }

  .main { position:relative; z-index:10; padding:40px 32px; max-width:600px; margin:0 auto; }
  .page-title { font-family:'Orbitron',monospace; font-size:2rem; font-weight:900; background:linear-gradient(135deg,#fff,var(--neon)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:32px; }

  /* Profile hero */
  .profile-hero {
    background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:36px;
    backdrop-filter:blur(20px); margin-bottom:24px; position:relative; overflow:hidden;
    animation:cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    box-shadow:0 0 60px rgba(0,245,255,0.06);
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  .profile-hero::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--neon),var(--neon2),var(--neon3)); }

  .avatar-wrap { position:relative; display:inline-block; margin-bottom:20px; }
  .big-avatar {
    width:90px; height:90px; border-radius:50%;
    background:linear-gradient(135deg,var(--neon),var(--neon2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron',monospace; font-weight:900; color:#000; font-size:2.5rem;
    box-shadow:0 0 30px rgba(0,245,255,0.5);
    animation:avatarPulse2 3s ease-in-out infinite alternate;
  }
  @keyframes avatarPulse2 { from{box-shadow:0 0 20px rgba(0,245,255,0.4)} to{box-shadow:0 0 50px rgba(255,0,255,0.6)} }
  .ring-outer { position:absolute; inset:-8px; border-radius:50%; border:2px solid transparent; border-top-color:var(--neon); border-right-color:var(--neon2); animation:spin 3s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .ring-inner2 { position:absolute; inset:-16px; border-radius:50%; border:1px solid transparent; border-bottom-color:rgba(0,245,255,0.3); border-left-color:rgba(255,0,255,0.3); animation:spin 5s linear infinite reverse; }

  .status-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.3); border-radius:20px; padding:4px 14px; font-size:0.68rem; font-family:'Orbitron',monospace; letter-spacing:1px; color:var(--neon3); margin-bottom:20px; }
  .status-dot { width:6px;height:6px;border-radius:50%;background:var(--neon3);animation:blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .field-group { margin-bottom:20px; position:relative; }
  .field-group label { display:block; font-size:0.68rem; letter-spacing:2px; text-transform:uppercase; color:rgba(0,245,255,0.7); margin-bottom:8px; font-family:'Orbitron',monospace; }
  .field-group input { width:100%; padding:14px 18px; background:rgba(0,245,255,0.04); border:1px solid rgba(0,245,255,0.12); border-radius:10px; color:#e0f8ff; font-family:'Exo 2',sans-serif; font-size:0.95rem; outline:none; transition:all 0.3s; }
  .field-group input:focus { border-color:var(--neon); box-shadow:0 0 20px rgba(0,245,255,0.18); background:rgba(0,245,255,0.08); }
  .field-group input[readonly] { opacity:0.5; cursor:not-allowed; }
  .field-group input::placeholder { color:rgba(255,255,255,0.2); }
  .field-group::after { content:''; position:absolute; left:1px; bottom:1px; height:2px; width:0; background:linear-gradient(90deg,var(--neon),var(--neon2)); border-radius:2px; transition:width 0.4s; }
  .field-group:focus-within::after { width:calc(100% - 2px); }

  .btn-update { padding:15px 32px; background:linear-gradient(135deg,rgba(0,245,255,0.1),rgba(255,0,255,0.1)); border:1px solid var(--neon); border-radius:10px; color:var(--neon); font-family:'Orbitron',monospace; font-size:0.8rem; letter-spacing:2px; cursor:pointer; transition:all 0.3s; position:relative; overflow:hidden; }
  .btn-update::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--neon),var(--neon2)); opacity:0; transition:0.3s; }
  .btn-update:hover { color:#000; box-shadow:0 0 30px rgba(0,245,255,0.4); transform:translateY(-2px); }
  .btn-update:hover::before { opacity:1; }
  .btn-update span { position:relative; z-index:1; }

  /* Stats mini */
  .mini-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:24px; }
  .mini-stat { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; backdrop-filter:blur(16px); animation:cardIn 0.8s both; }
  .mini-stat-val { font-family:'Orbitron',monospace; font-size:1.5rem; font-weight:900; color:var(--neon); }
  .mini-stat-lbl { font-size:0.65rem; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-top:4px; }

  .toast { position:fixed; top:80px; right:24px; background:rgba(0,255,136,0.1); border:1px solid var(--neon3); border-radius:12px; padding:16px 24px; color:var(--neon3); font-family:'Orbitron',monospace; font-size:0.75rem; letter-spacing:1px; transform:translateX(120%); transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index:200; backdrop-filter:blur(16px); }
  .toast.show { transform:translateX(0); }
</style>
</head>
<body>
<div id="stars"></div>
<div class="grid-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="scan-line"></div>
<div class="toast" id="toast">✓ Profile Updated Successfully</div>

<nav>
  <div class="nav-brand">CommTrace</div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="addcontant.html">Add Contact</a>
    <a href="context.html">Contacts</a>
    <a href="profile.html" class="active">Profile</a>
    <a href="about.html">About</a>
    <a href="index.html">Logout</a>
  </div>
  <div class="avatar-nav">V</div>
</nav>

<div class="main">
  <div class="page-title">My Profile</div>

  <div class="mini-stats">
    <div class="mini-stat" style="animation-delay:0s">
      <div class="mini-stat-val" id="totalContacts">0</div>
      <div class="mini-stat-lbl">Contacts</div>
    </div>
    <div class="mini-stat" style="animation-delay:0.1s">
      <div class="mini-stat-val">0</div>
      <div class="mini-stat-lbl">Analyses</div>
    </div>
    <div class="mini-stat" style="animation-delay:0.2s">
      <div class="mini-stat-val">—</div>
      <div class="mini-stat-lbl">Last Active</div>
    </div>
  </div>

  <div class="profile-hero">
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px">
      <div class="avatar-wrap">
        <div class="big-avatar" id="bigAvatar">V</div>
        <div class="ring-outer"></div>
        <div class="ring-inner2"></div>
      </div>
      <div>
        <div style="font-family:'Orbitron',monospace;font-size:1.2rem;color:#e0f8ff;margin-bottom:6px" id="displayName">Ankesh Gupta</div>
        <div class="status-badge"><span class="status-dot"></span>ACTIVE INVESTIGATOR</div>
      </div>
    </div>

    <div class="field-group">
      <label>Display Name</label>
      <input type="text" id="nameInput" value="Ankesh Gupta" placeholder="Enter your name">
    </div>
    <div class="field-group">
      <label>Email Address</label>
      <input type="email" id="emailInput" value="ankeshgupta@gmail.com" readonly>
    </div>

    <button class="btn-update" onclick="updateProfile()"><span>◈ UPDATE PROFILE</span></button>
  </div>
</div>

<script>
const starsEl=document.getElementById('stars');
for(let i=0;i<120;i++){
  const s=document.createElement('div'); s.className='star';
  const size=Math.random()*2+0.5;
  s.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${Math.random()*4+2}s;animation-delay:${Math.random()*5}s`;
  starsEl.appendChild(s);
}
// Load stats
const contacts=JSON.parse(localStorage.getItem('ct_contacts')||'[]');
document.getElementById('totalContacts').textContent=contacts.length;

function updateProfile(){
  const name=document.getElementById('nameInput').value;
  document.getElementById('displayName').textContent=name;
  document.getElementById('bigAvatar').textContent=name[0].toUpperCase();
  const toast=document.getElementById('toast');
  toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),3000);
}
</script>
</body>
</html>
